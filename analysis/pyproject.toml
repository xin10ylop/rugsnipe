[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rugsnipe-analysis"
version = "0.1.0"
description = "Validation tooling for the pump.fun rugger-sniping hypothesis"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "websockets>=13"]

[tool.setuptools]
packages = ["rugsnipe_analysis"]
