# Local TLS relay for the Jito block engine (docs/08 section 9, 2026-10-22).
#
# The hot-path senders speak plain HTTP/1.1 over warm TCP connections (no TLS
# on the hot thread). Jito's block engine refuses plain HTTP, so this nginx
# server terminates TLS on the box: the sender posts to 127.0.0.1:8081 and
# nginx forwards over a warm, reused TLS session to Frankfurt. Keyless
# bundleOnly sends (a bundleOnly transaction that fails costs nothing).
#
# Install (Ubuntu 24.04):
#   sudo apt-get install -y nginx && sudo rm -f /etc/nginx/sites-enabled/default
#   sudo cp deploy/nginx/jito-relay.conf /etc/nginx/conf.d/jito-relay.conf
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl restart nginx
# Config:
#   jito = { enabled = true, region = "frankfurt", url = "http://127.0.0.1:8081", max_rps = 1 }
# Check (expect a JSON-RPC "Failed to deserialize packet" error, i.e. Jito answered):
#   curl -s -m 5 -X POST "http://127.0.0.1:8081/api/v1/transactions?bundleOnly=true" \
#     -H 'content-type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"sendTransaction","params":["AA==",{"encoding":"base64"}]}'
#
# nginx resolves the upstream host once at start; restart nginx if Jito moves
# the endpoint (the sender logs "io" or "http 502" once a minute when it does).

upstream jito_frankfurt {
    server frankfurt.mainnet.block-engine.jito.wtf:443;
    keepalive 8;
    keepalive_timeout 300s;
}

server {
    listen 127.0.0.1:8081;
    access_log off;

    location / {
        proxy_pass https://jito_frankfurt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host frankfurt.mainnet.block-engine.jito.wtf;
        proxy_ssl_server_name on;
        proxy_ssl_name frankfurt.mainnet.block-engine.jito.wtf;
        proxy_ssl_session_reuse on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 3s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
