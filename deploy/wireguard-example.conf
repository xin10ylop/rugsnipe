# WireGuard wg0 between ohio1 (analytics, AWS us-east-2) and fra1 (hot, Frankfurt).
# docs/06-architecture.md section 2: rslog + state.db snapshots fra1 -> ohio1 every 5 min,
# ArmSet push ohio1 -> fra1, Prometheus scrape of fra1 10.77.0.2:9464, and (phase 2) the
# 50 ms heartbeat between hot boxes. ~105 ms RTT Ohio<->Frankfurt; nothing latency-critical
# crosses this link.
#
# PLACEHOLDERS ONLY. Never commit real keys: real files live at /etc/wireguard/wg0.conf
# (root 0600) and are gitignored (wg0.conf, deploy/*.local.conf).
#
# Keys, on each box:
#   umask 077; wg genkey | tee /etc/wireguard/wg0.key | wg pubkey > /etc/wireguard/wg0.pub
#   once, on either box: wg genpsk   (the same PresharedKey goes into both files)
# Addresses: 10.77.0.1 = ohio1, 10.77.0.2 = fra1, 10.77.0.3 = ams1 (phase 2).
# Firewalls:
#   AWS security group of ohio1: inbound UDP 51820 from <FRA1_PUBLIC_IP>/32 only.
#   fra1 (ufw): ufw allow from <OHIO1_PUBLIC_IP> to any port 51820 proto udp
#               ufw allow in on wg0 to any port 9464 proto tcp      # metrics, wg0 only
#               ufw allow in on wg0 to any port 22 proto tcp        # ssh from ohio1
# Bring up: systemctl enable --now wg-quick@wg0 ; check: wg show ; ping 10.77.0.2

# ============================== ohio1: /etc/wireguard/wg0.conf ==============================
[Interface]
Address = 10.77.0.1/24
ListenPort = 51820
PrivateKey = <OHIO1_PRIVATE_KEY>
# MTU: EC2 internet path MTU is 1500; WireGuard overhead 80 bytes
MTU = 1420

[Peer]
# fra1
PublicKey = <FRA1_PUBLIC_KEY>
PresharedKey = <OHIO1_FRA1_PSK>
Endpoint = <FRA1_PUBLIC_IP>:51820
AllowedIPs = 10.77.0.2/32
PersistentKeepalive = 25

# ============================== fra1: /etc/wireguard/wg0.conf ===============================
# (copy this half to fra1 and uncomment)
