[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
license = "UNLICENSED"
publish = false

# Dependency set from docs/research/speed-reference-impls.md section 7 (Agave 4.3
# component line). Do NOT use solana-sdk 5.x (type-incompatible with the 4.3
# clients) and never bincode 3.x (compile_error tombstone).
[workspace.dependencies]
# Solana components (Agave 4.3 line)
solana-pubkey = { version = "4.4", default-features = false }
solana-address = "2.8"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-signature = "3.5"
solana-hash = "4.6"
solana-instruction = { version = "3.5", default-features = false }
solana-message = "4.6"                 # has versions::v1
solana-transaction = "4.3"
solana-compute-budget-interface = "3.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-commitment-config = "3.1"
solana-rpc-client = "=4.3.1"           # cold path only (blockhash, ALT, sims)
solana-rpc-client-api = "=4.3.1"
spl-associated-token-account-interface = "2.0"
spl-token-2022-interface = "3.1"       # pulls zk proof crates: keep out of the hot path
agave-transaction-view = "6.1"         # oracle for our own TxView (tx v1 aware)
# pump: official builders/PDAs/math, no RPC feature (oracle only)
pump-rust-client = { version = "=0.4.1", default-features = false }
# feed
yellowstone-grpc-client = "15.0.0"
yellowstone-grpc-proto = "14.0.1"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots", "zstd"] }
prost = "0.14.4"
# runtime / encoding
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
borsh = { version = "1.8", features = ["derive"] }
bincode = "1.3"                        # never 3.x
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-tls"] }
quinn = "0.11"

# Workspace-local crates
pump-codec = { path = "crates/pump-codec" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
panic = "abort"                        # the hot binary's panic hook latches the kill first (docs/08 s10)
