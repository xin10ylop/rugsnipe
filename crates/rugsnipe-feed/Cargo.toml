[package]
name = "rugsnipe-feed"
version = "0.1.0"
description = "Feed adapters (logsSubscribe websocket, PumpPortal, collector relay, replay) producing allocation-free FeedEvents, plus cross-feed dedup, FiredSet, FeedHealth and a bounded raw-frame recorder."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ws"]
# Websocket adapters (LogsWs, PumpPortal) and the cold JSON-RPC client. They run on
# their own thread with a current-thread tokio runtime; the hot poll() never touches tokio.
ws = ["dep:tokio", "dep:tokio-tungstenite", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:futures-util"]
# Yellowstone gRPC (Dragon's Mouth) post-execution feed: Triton, Alchemy, Helius LaserStream,
# SVS... (docs/research/infra-shopping-2026.md section 1). Own thread + tokio runtime, like `ws`.
grpc = ["ws", "dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto", "dep:tonic"]
# A local Yellowstone server (tonic, loopback h2c) for tests in this and other crates.
grpc-mock = ["grpc"]

[dependencies]
pump-codec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
bs58 = { workspace = true }
base64 = { workspace = true }
rtrb = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "time", "io-util", "macros", "sync"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
yellowstone-grpc-client = { workspace = true, optional = true }
yellowstone-grpc-proto = { workspace = true, optional = true }
tonic = { version = "0.14.6", default-features = false, features = ["tls-ring"], optional = true }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "io-util", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[lints.clippy]
too_many_arguments = "allow"

[[example]]
name = "tail"
required-features = ["ws"]

[[test]]
name = "grpc_mock"
required-features = ["grpc-mock"]

[[test]]
name = "deshred"
required-features = ["grpc-mock"]
