# rslog record layouts (docs/06 section 5.3). Little-endian, no padding.
# Frame: header (30 bytes) + payload. Checked by rugsnipe-core tests/rslog.rs
# (encoder sizes and field order) and by the golden file fixtures/golden.rslog.
# The Python ingest decoder (analysis) must follow this file.

[header]
fields = ["magic:u32=0x52534C47", "kind:u16", "ver:u16", "len:u32", "mono_ns:u64", "wall_ns:u64", "box:u16"]
size = 30

[[kind]]
id = 1
name = "FeedSeen"
fields = ["src:u8", "slot:u64", "recv_ns:u64", "sig:[64]"]
size = 81

[[kind]]
id = 2
name = "CreateHit"
fields = ["src:u8", "slot:u64", "sig:[64]", "mint:[32]", "user:[32]", "fee_payer:[32]", "creator:[32]", "launcher:[32]", "intx_sol_in:u64", "intx_tokens_out:u64", "intx_buys:u8", "n_signers:u8", "flags:u16"]
size = 253
flags = { mayhem = 1, cashback = 2, sol_quote = 4, exact = 8, logs_source = 16, logs_truncated = 32, holder_reward = 64, token_2022 = 128 }

[[kind]]
id = 3
name = "Matched"
fields = ["intent:u64", "op_id:u32", "armset_ver:u64", "via:u8", "shadow:u8"]
size = 22

[[kind]]
id = 4
name = "Decision"
fields = ["intent:u64", "mint:[32]", "mode:u8", "code:u8", "would_skip:u8", "size:u64", "v_max:u64", "min_tokens:u64", "nonce_idx:u16", "decided_ns:u64"]
size = 77
# code: 0 fire, 0x10|paper_reason, 0x20|skip_reason (rugsnipe_core::risk)

[[kind]]
id = 5
name = "Sent"
fields = ["intent:u64", "variant:u8", "sender:u8", "prio:u64", "tip:u64", "sig:[64]", "result:u8", "latency_ns:u64"]
size = 99

[[kind]]
id = 6
name = "PosEvent"
fields = ["intent:u64", "kind:u8", "slot:u64", "v:u64", "tokens:u64"]
size = 33

[[kind]]
id = 7
name = "ExitFired"
fields = ["intent:u64", "reason:u8", "tokens:u64", "min_out:u64", "sig:[64]"]
size = 89

[[kind]]
id = 8
name = "Risk"
fields = ["kind:u8", "value:i64"]
size = 9

[[kind]]
id = 9
name = "FeedHealth"
fields = ["src:u8", "ok:u8", "lag_ms:u32", "decode_miss_ppm:u32"]
size = 10

[[kind]]
id = 10
name = "Lease"
fields = ["name_hash:u32", "owner:u16", "epoch:u64", "hb_unix_ms:u64"]
size = 22

[[kind]]
id = 11
name = "Upgrade"
fields = ["program:[32]", "slot:u64"]
size = 40

[[kind]]
id = 12
name = "NonceEvt"
fields = ["idx:u16", "from:u8", "to:u8", "slot:u64", "value:[32]", "intent:u64"]
size = 52

[[kind]]
id = 13
name = "Shadow"
fields = ["intent:u64", "mint:[32]", "model:u8", "outcome:u8", "create_slot:u64", "create_index:u32", "block_txs:u32", "bundle_trades:u8", "bundle_wallets:u8", "our_index:u32", "tp_ahead:u8", "tp_behind:u8", "s0_failed:u8", "premium_bps:u32", "post_bundle_v:u64", "post_bundle_t:u64", "post_bundle_mcap:u64"]
size = 95
# model: 1 e1, 2 e2. outcome: 0 filled, 1 premium, 2 slippage, 3 not_in_slot0, 4 class, 5 unresolved, 6 filtered
# (rugsnipe_core::rslog::ShadowOutcome). post_bundle_mcap in lamports (1e9 supply).

[[kind]]
id = 14
name = "FailedBuy"
fields = ["intent:u64", "mint:[32]", "reason:u8", "cost:u64", "slot:u64", "premium_bps:u32"]
size = 61
# reason: a ShadowOutcome (1 premium, 2 slippage, 3 not_in_slot0, 4 class); cost = priority fee paid (0 for class)

[[kind]]
id = 15
name = "Filter"
fields = ["intent:u64", "mint:[32]", "score_bits:u64", "tertile:u8", "mode:u8", "skipped:u8", "op_lead_n:u32", "bw_lead_n:u32"]
size = 59
# The entry filter (entry.filter_model): score_bits = f64::to_bits(P(take-profit)); tertile 0 bottom (< t1),
# 1 middle, 2 top (>= t2), 255 not scored; mode 0 log, 1 skip; skipped = dropped (outcome 6 filtered);
# op_lead_n / bw_lead_n = our own LEAD outcomes known for the signer / the best-known bundle wallet.

[[kind]]
id = 16
name = "Presend"
fields = ["intent:u64", "mint:[32]", "score_bits:u64", "tertile:u8", "mode:u8", "cut:u8", "scored:u8", "skipped:u8"]
size = 53
# The pre-send entry gate (entry.presend_model) at the fire point: score_bits = f64::to_bits(P(take-profit)) of the
# pre-send vector; tertile 0 bottom (< t1), 1 middle, 2 top (>= t2); mode 1 log, 2 skip; cut 1 = t1, 2 = t2;
# scored 0 = no create trade (bundle block zeros, never skipped); skipped = not sent (decision skip_presend).
