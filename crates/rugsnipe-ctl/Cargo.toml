[package]
name = "rugsnipe-ctl"
version = "0.1.0"
description = "Operator CLI: config validate, template dump, nonce init/close (dry-run), armset verify, sim (read-only simulateTransaction fit of the per-mint CU limit; feature `rpc`). Never sends transactions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `ctl sim`: read-only simulateTransaction (sigVerify false) on live mints.
rpc = ["rugsnipe-sim/rpc", "rugsnipe-tx/rpc"]

[dependencies]
pump-codec = { workspace = true }
rugsnipe-sim = { path = "../rugsnipe-sim" }
rugsnipe-core = { path = "../rugsnipe-core" }
rugsnipe-tx = { path = "../rugsnipe-tx" }
rugsnipe-exit = { path = "../rugsnipe-exit" }
base64 = { workspace = true }
bs58 = { workspace = true }
serde_json = { workspace = true }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }

[lints.clippy]
too_many_arguments = "allow"
