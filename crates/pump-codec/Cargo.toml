[package]
name = "pump-codec"
version = "0.1.0"
description = "Pure-byte codec for the pump.fun bonding-curve and PumpSwap programs: constants, PDAs, curve math, events, instruction parse/build and a zero-copy transaction view (legacy, v0, v1)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
solana-pubkey = { workspace = true, features = ["std", "curve25519", "sha2"] }
solana-instruction = { workspace = true, features = ["std"] }
base64 = { workspace = true }
bs58 = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
serde_json = { workspace = true }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-signature = { workspace = true }
solana-message = { workspace = true, features = ["wincode"] }
solana-transaction = { workspace = true, features = ["wincode"] }
solana-compute-budget-interface = { workspace = true, features = ["borsh"] }
solana-system-interface = { workspace = true }
spl-associated-token-account-interface = { workspace = true }
agave-transaction-view = { workspace = true }
pump-rust-client = { workspace = true }

[lints.clippy]
too_many_arguments = "allow"
